name: Canary Build

# Manual only. Unlike release.yml, this never creates a GitHub Release or
# tag — artifacts land on the workflow run page only, so a canary build can
# never collide with or overwrite a real release. Pick which platforms to
# build (all on by default) and which ref to build from when dispatching —
# normally that's the `canary` branch, but any branch/tag/SHA works.
on:
  workflow_dispatch:
    inputs:
      windows:
        description: Build Windows
        type: boolean
        default: true
      linux:
        description: Build Linux
        type: boolean
        default: true
      macos:
        description: Build macOS
        type: boolean
        default: true
      android:
        description: Build Android
        type: boolean
        default: true

jobs:
  build-linux:
    if: ${{ inputs.linux }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux bundler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app (Linux)
        run: bun run tauri build --bundles deb,appimage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canary-linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-windows:
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app (Windows)
        run: bun run tauri build --bundles msi,nsis

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canary-windows-bundles
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    if: ${{ inputs.macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          # macos-latest runners are Apple Silicon; a universal binary needs
          # the Intel target installed too, not just the host's.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app (macOS, universal)
        run: bun run tauri build --target universal-apple-darwin --bundles dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canary-macos-bundles
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-android:
    if: ${{ inputs.android }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"

      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app (Android, debug-signed)
        run: bun run tauri android build --debug --apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: canary-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
