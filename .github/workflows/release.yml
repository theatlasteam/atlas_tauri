name: Release

# Manual only — running this deletes and recreates the release/tag named below
# with fresh build artifacts for Android, Windows, Linux, and macOS.
on:
  workflow_dispatch:

env:
  RELEASE_TAG: a4

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux bundler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app (Linux)
        run: bun run tauri build --bundles deb,appimage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app (Windows)
        run: bun run tauri build --bundles msi,nsis

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          # macos-latest runners are Apple Silicon; a universal binary needs
          # the Intel target installed too, not just the host's.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app (macOS, universal)
        run: bun run tauri build --target universal-apple-darwin --bundles dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"

      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app (Android, debug-signed)
        run: bun run tauri android build --debug --apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Replace existing release with the same tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          git tag -f "$RELEASE_TAG"
          git push origin "$RELEASE_TAG" --force

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Collected with find, not `**` globs: bash leaves globstar off, so
          # `artifacts/android-apk/**/*.apk` silently degraded to a single
          # directory level and matched nothing (the APK nests one deeper as
          # <abi>/<buildType>/*.apk), failing the publish after all three
          # builds had succeeded. find is depth-agnostic.
          mapfile -t assets < <(find artifacts -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' \
               -o -name '*.exe' -o -name '*.dmg' -o -name '*.apk' \) | sort)

          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no release assets found under artifacts/"
            find artifacts -type f | head -50
            exit 1
          fi
          printf 'attaching: %s\n' "${assets[@]}"

          gh release create "$RELEASE_TAG" \
            --title "Atlas ($RELEASE_TAG)" \
            --notes "Automated build from commit $GITHUB_SHA. Android APK is debug-signed (testing only). The macOS .dmg is unsigned and unnotarized — Gatekeeper will call it damaged/unverified; right-click > Open, or run 'xattr -cr /Applications/atlas.app' after install." \
            "${assets[@]}"
