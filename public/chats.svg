<svg id="svg-chats" class="ph-stroke" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" width="256" height="256" style="cursor:pointer"><style>@keyframes bubbleShakeA{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-6px,4px) rotate(-8deg)}40%{transform:translate(5px,-5px) rotate(6deg)}60%{transform:translate(-4px,3px) rotate(-4deg)}80%{transform:translate(3px,-2px) rotate(2deg)}}@keyframes bubbleShakeB{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(6px,-4px) rotate(8deg)}40%{transform:translate(-5px,5px) rotate(-6deg)}60%{transform:translate(4px,-3px) rotate(4deg)}80%{transform:translate(-3px,2px) rotate(-2deg)}}.anim .bubble-a{animation:bubbleShakeA .6s ease;transform-origin:104px 104px}.anim .bubble-b{animation:bubbleShakeB .6s ease .06s;transform-origin:160px 152px}</style>
