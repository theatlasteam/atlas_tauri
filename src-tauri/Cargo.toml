[package]
name = "atlas"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# E2EE primitives — private keys live in the Rust core, never in the webview.
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
thiserror = "2"

# JNI bridge for the Android notification service (src/android_push.rs).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# OS keychain for the auth token (desktop). Mobile uses the app-sandboxed
# data dir instead (iOS data protection / Android app-private storage).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Keep the build directory small on this machine; flip back to `debug = 2`
# when line-level backtraces are needed.
[profile.dev]
debug = 0
