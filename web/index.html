<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131110" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Atlas — мессенджер со сквозным (E2E) шифрованием</title>
    <meta
      name="description"
      content="Atlas — современный защищённый мессенджер с E2E шифрованием для Windows, Linux и Android. Личные сообщения, группы, голосовые и видеозвонки. Построен на Tauri, Solid.js и Rust."
    />
    <!-- "/" aliases the Russian route (primary audience) — content and
         locale detection match /ru exactly, but this stays the canonical
         "/" so it doesn't compete with /ru for indexing. -->
    <link rel="canonical" href="https://atlasmsg.app/ru" />
    <link rel="alternate" hreflang="ru" href="https://atlasmsg.app/ru" />
    <link rel="alternate" hreflang="en" href="https://atlasmsg.app/en" />
    <link rel="alternate" hreflang="x-default" href="https://atlasmsg.app/ru" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
